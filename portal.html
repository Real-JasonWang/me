<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal to Old Website | Jason Wang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #030305;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 44px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .icon-box {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00F0FF;
            font-size: 24px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 9999px;
            background: #00F0FF;
            color: #030305;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="icon-box">
            <i class="fa-solid fa-clock-rotate-left"></i>
        </div>
        <h2>正在前往旧版网站...</h2>
        <p>Redirecting to Archived Website.<br>如果页面没有自动跳转，请点击下方按钮：</p>
        <a href="./old/" class="btn">
            <span>立即进入旧版</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = './old/';
        }, 1500);
    </script>
</body>
</html>
